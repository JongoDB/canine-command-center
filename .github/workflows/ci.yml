name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Throwaway Postgres for the DB-migration check below.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ccc
          POSTGRES_PASSWORD: ccc_ci
          POSTGRES_DB: ccc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccc -d ccc_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: DB migrations apply on a fresh database
        env:
          DATABASE_URL: postgres://ccc:ccc_ci@localhost:5432/ccc_ci
          # env.ts validates the whole config on import; the migrate script
          # transitively pulls it in, so it needs every required var present.
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
        run: |
          pnpm --filter @ccc/api db:check
          # Run again — migrations must be idempotent.
          pnpm --filter @ccc/api db:check

      - name: Test
        env:
          # Point the API tests at the Postgres service so the DB-backed suites
          # (auth) run; without this they self-skip.
          DATABASE_URL: postgres://ccc:ccc_ci@localhost:5432/ccc_ci
          BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
        run: pnpm test

      - name: Build
        run: pnpm build

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory only — surfaces vulnerable deps without blocking the merge.
    # Dependabot opens the actual upgrade PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
