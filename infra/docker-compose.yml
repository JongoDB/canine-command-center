# Local development stack for Canine Command Center.
#   pnpm db:up      # start postgres + mailpit + minio
#   pnpm db:down    # stop & remove containers (named volumes persist)
#   pnpm db:logs    # tail postgres
#
# Config comes from the repo-root .env (see .env.example) with the defaults
# below. Data persists in named volumes (`docker volume ls | grep ccc-dev`);
# `docker compose -f infra/docker-compose.yml down -v` wipes them.

name: ccc-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ccc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ccc}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ccc} -d ${POSTGRES_DB:-ccc}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches outbound email in dev (verification, password reset, digests).
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  # S3-compatible object storage for photos/video in dev.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ccc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ccc_dev_password}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
